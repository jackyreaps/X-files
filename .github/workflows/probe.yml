name: Probe RowsU
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: main
          fetch-depth: 1

      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
          build: false

      - name: Fetch cache and inspect RowsU
        run: |
          lake exe cache get
          cat << 'EOF' > ProbeRowsU.lean
          import Lean
          import Development.AutomorphicArithmetic.ThetaCorrespondence.ThetaPairLifts.ThirdPlaceSeries.DefiniteSideCondition

          open Lean Elab Command

          #print Formalism.L2.RowDataTransport.RowsU
          #print Formalism.L2.RowDataTransport.packageOfPrimitiveLinks

          #eval show CommandElabM Unit from do
            let env ← getEnv
            let roots := [`Formalism.L2.RowDataTransport.RowsU]
            let mut visited : NameSet := {}
            let mut queue : List Name := roots
            let mut trivialHits : List Name := []
            while !queue.isEmpty do
              let curr :: rest := queue | break
              queue := rest
              if visited.contains curr then continue
              visited := visited.insert curr
              let s := curr.toString
              if s.startsWith "Lean." || s.startsWith "Init." || s.startsWith "Std." || s.startsWith "Mathlib." then
                continue
              if let some cinfo := env.find? curr then
                if cinfo.type == mkConst ``True || cinfo.value? == some (mkConst ``True) then
                  trivialHits := curr :: trivialHits
                let deps := cinfo.type.getUsedConstants.toList ++
                  (match cinfo.value? with | some v => v.getUsedConstants.toList | none => [])
                queue := queue ++ deps.eraseDups
            IO.println s!"RowsU non-stdlib cone size: {visited.size}"
            IO.println s!"Direct True definitions in RowsU cone: {trivialHits}"
          EOF
          lake env lean ProbeRowsU.lean
