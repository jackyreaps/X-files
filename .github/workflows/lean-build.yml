name: Lean build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Assert lakefile and toolchain pin Mathlib v4.30.0
        run: |
          grep -q 'rev = "v4.30.0"' lakefile.toml || \
            { echo "::error::lakefile.toml does not pin v4.30.0"; exit 1; }
          grep -q 'v4.30.0' lean-toolchain || \
            { echo "::error::lean-toolchain does not pin v4.30.0"; exit 1; }

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: lake-${{ runner.os }}-

      - name: lake update + Mathlib olean cache
        run: |
          lake update
          lake exe cache get

      - name: Build RiemannHypothesis
        run: lake build RiemannHypothesis

      - name: Sorry gate (scoped to riemann-hypothesis/)
        run: |
          # Matches ONLY actual sorries in code, completely ignoring comments.
          # Catches patterns like: "  sorry", ":= sorry", ":= by sorry"
          n=$(grep -rn --include='*.lean' -E '^[[:space:]]*sorry\b|:=[[:space:]]*by[[:space:]]+sorry\b|:=[[:space:]]*sorry\b' riemann-hypothesis/ | wc -l)
          echo "Sorry count in riemann-hypothesis/: $n (allowed: 3)"
          if [ "$n" -ne 3 ]; then
            echo "::error::Sorry count $n != 3"
            grep -rn --include='*.lean' -E '^[[:space:]]*sorry\b|:=[[:space:]]*by[[:space:]]+sorry\b|:=[[:space:]]*sorry\b' riemann-hypothesis/
            exit 1
          fi

      - name: Policy gate (no axiom / native_decide / unsafe)
        run: |
          for pat in '^axiom ' 'native_decide' 'unsafe def' 'unsafe theorem'; do
            hits=$(grep -rn --include='*.lean' -E "$pat" riemann-hypothesis/ | wc -l || true)
            if [ "$hits" -gt 0 ]; then
              echo "::error::Policy ban: $pat ($hits hits)"
              grep -rn --include='*.lean' -E "$pat" riemann-hypothesis/
              exit 1
            fi
          done
